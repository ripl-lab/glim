# Settings for docker/run.sh (bash). Generated by ripl_utils/ai_agents/claude-docker-project.sh.
# Folders are mounted at their host paths. Ones missing on a machine are skipped,
# except OUTPUT_DIRS, which are created. Paths under $HOME work for every lab member.

NAME=glim
BASE_IMAGE=ubuntu:22.04
ROS_DISTRO=''            # set for a ROS 2 project: adds a colcon workspace volume

CODE_DIRS=("$HOME"/git/glim_ros2 "$HOME"/git/b2_description "$HOME"/git/b2_interfaces "$HOME"/git/unitree_ros2)   # other source the agent may edit
DATA_DIRS=(/home/russell/datasets/BurnHouse_Oct7_2026)   # raw datasets, rosbags, calibration: read-only
REF_DIRS=()   # reference material such as papers: read-only
OUTPUT_DIRS=("$HOME"/results/glim)   # where results go: writable
PROTECT=()   # paths inside the repo kept read-only, e.g. tests or eval code

# Resources. Override per run, e.g. MEM_LIMIT=32g docker/run.sh
MEM_LIMIT="${MEM_LIMIT-16g}"
CPUS="${CPUS-8}"
GPUS="${GPUS-}"              # e.g. all
HOST_NETWORK="${HOST_NETWORK-0}"   # 1 shares the host network (ROS discovery stays on this machine)
